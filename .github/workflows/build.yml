name: Build PPTX2PDF Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          pytest tests/ -v

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean pptx2pdf.spec

      - name: Verify Executable Built
        run: |
          if (Test-Path "dist/PPTX2PDF.exe") {
              Write-Host "PPTX2PDF.exe successfully created."
          } else {
              Write-Host "Error: dist/PPTX2PDF.exe was not found."
              exit 1
          }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPTX2PDF-Windows-x64
          path: dist/PPTX2PDF.exe
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PPTX2PDF.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
